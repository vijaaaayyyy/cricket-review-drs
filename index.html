<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Cricket Review System · Live DRS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; background: #0a0a0f; color: #f0f0f5; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    .btn { border-radius: 0.75rem; font-weight: 600; transition: transform 0.1s, filter 0.15s; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    video::-webkit-media-controls { display: none !important; }
    .pulse-rec { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
    input[type=range] { accent-color: #00a651; }
    .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #drawCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    .tool-active { outline: 2px solid #ffcc00; outline-offset: 2px; }
  </style>
</head>

  <div id="app" class="min-h-screen flex flex-col"></div>

</html>
